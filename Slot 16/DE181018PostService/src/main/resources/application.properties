spring.application.name=DE181018PostService
server.port=8082

# SQL Server Configuration (Khớp mục 2.2.1 Dethi_guide.md)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE_MEDIA;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# UserService URL for FeignClient (Khớp mục 2.2.1)
user.service.url=http://localhost:8081

# Swagger UI / OpenAPI 3
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
